services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-subscript}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-subscript_dev}
      POSTGRES_DB: ${POSTGRES_DB:-subscript}
    ports:
      - "5432:5432"
    volumes:
      - subscript_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-subscript} -d ${POSTGRES_DB:-subscript}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  subscript_pgdata:
