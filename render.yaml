# Render Blueprint for Subscript.
#
# Deploy with: Render Dashboard -> New -> Blueprint -> this repository.
# All services use free plans by default so the blueprint can be evaluated
# without creating paid resources. Raise the plans before production use.
#
# After the first deploy:
#   1. Set CORS_ORIGINS on the API to the public web URL.
#   2. Set VITE_API_URL on the web service to the public API URL, then redeploy
#      the web service so Vite bakes it into the bundle.
#   3. Optionally set the three RAZORPAY_* values on both API and worker.
#   4. Set the SMTP values on the worker if email delivery is required.

databases:
  - name: subscript-db
    databaseName: subscript
    user: subscript
    plan: free
    region: oregon

services:
  - type: redis
    name: subscript-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction

  - type: web
    name: subscript-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: subscript-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: subscript-redis
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: SESSION_COOKIE_NAME
        value: __Host-subscript_session
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: BCRYPT_COST
        value: "12"
      - key: LOG_REQUESTS
        value: "true"
      - key: METRICS_TOKEN
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - type: worker
    name: subscript-worker
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    dockerCommand: node apps/server/dist/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: subscript-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: subscript-redis
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: web
    name: subscript-web
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build -w @subscript/shared && npm run build -w @subscript/web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
